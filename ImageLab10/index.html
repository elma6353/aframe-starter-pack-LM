<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
  </head>
  <body>
    <a-scene>
      <a-box position="-1 0.5 -3" rotation="0 45 0" color="tan" src="Assets/sand.jpg"></a-box>
      <a-sphere position="1 2 -5" radius="0.75" color="pink" src="Assets/icecream.jpeg"></a-sphere>
      <a-cone position="1 1 -5" radius-bottom="0" radius-top="0.6" height="1.5" color="tan" src="Assets/cone.jpg"></a-cone>
      <a-cylinder position="-1 1 -3" radius="0.25" height="1" color="tan" src="Assets/sand.jpg"></a-cylinder>
      <a-cone position="-1 1.8 -3" radius-bottom="0.4" radius-top="0" height="0.75" color="tan" src="Assets/sand.jpg"></a-cone>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="tan"></a-plane>
      <a-sky src="Assets/landscape.jpeg"></a-sky>
    </a-scene>
  </body>
</html>
