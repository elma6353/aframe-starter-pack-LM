<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
     <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
  </head>
  
  <body>
    <a-scene>
      <a-sphere position="0 3 -5" rotation="0 45 0" color="white"></a-sphere>
      <a-sphere position="0 1.25 -5" radius="1.5" color="white"></a-sphere>
      <a-sphere position="0 4.25 -5" radius="0.70" height="1.5" color="white"></a-sphere>
      <a-sphere position="-0.25 4 -4" radius="0.05" color="black"></a-sphere>
      <a-sphere position="0.25 4 -4" radius="0.05" color="black"></a-sphere>
      <a-cone position="0 5 -5" radius-bottom="1" radius-top="0.5" height="1" color="black"></a-cone>
      <a-plane position="0 0.1 -4" rotation="-90 0 0" width="4" height="4" color="lightblue"></a-plane>
      <!-- <a-sky color="#ECECEC"></a-sky> -->
      <!-- the enviroment entity includes a sky. Choose from the presets"none, default, contact, 
       egypt, checkerboard, forest, goaland, yavapai, goldmine, threetowers, poison, arches, tron, japan, dream, 
       volcano, starry, osiris, moon" -->
      <a-entity environment="preset: osiris; dressingAmount: 500"></a-entity>
    </a-scene>
  </body>
</html>
